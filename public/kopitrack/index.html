<!doctype html><html lang="id"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="color-scheme" content="light dark"/><title>KopiTrack</title><link rel="stylesheet" href="/kopitrack/styles.css?v=20260523-db"/><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js" defer></script><script src="/kopitrack/app.js?v=20260523-db" defer></script></head><body><div class="loading-overlay" id="loadingOverlay" hidden><div class="loader"></div><p>Memproses</p></div><div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="true"></div><div class="modal" id="passcodeModal" hidden role="dialog" aria-modal="true"><div class="modal-content"><h2>Akses tambah kopi</h2><form class="simple-form" id="passcodeForm"><input id="passcodeInput" type="password" inputmode="numeric" autocomplete="one-time-code" placeholder="Passcode" required/><div class="modal-actions"><button class="secondary-button" id="cancelPasscodeButton" type="button">Batal</button><button class="primary-button" type="submit">Unlock</button></div></form></div></div><div class="modal" id="deleteModal" hidden role="dialog" aria-modal="true"><div class="modal-content"><h2>Hapus data?</h2><p id="deleteMessage">Data pembelian akan dihapus.</p><div class="modal-actions"><button class="secondary-button" id="cancelDeleteButton" type="button">Batal</button><button class="danger-button" id="confirmDeleteButton" type="button">Hapus</button></div></div></div><div class="modal" id="editModal" hidden role="dialog" aria-modal="true"><div class="modal-content"><h2>Edit pembelian</h2><form class="simple-form" id="editForm"><input id="editBrandInput" type="text" placeholder="Brand" required/><input id="editVariantInput" type="text" placeholder="Varian" required/><input id="editPriceInput" type="number" min="1" step="1" inputmode="numeric" placeholder="Harga" required/><input id="editDateInput" type="date" required/><div class="modal-actions"><button class="secondary-button" id="cancelEditButton" type="button">Batal</button><button class="primary-button" type="submit">Simpan</button></div></form></div></div><div class="app"><header class="app-header"><div class="header-left"><h1 class="app-title">KopiTrack</h1><span class="unlock-badge" id="unlockStatus">Terkunci</span></div><div class="header-right"><button class="icon-btn" id="themeButton" type="button">Mode terang</button><a class="back-link" href="/">Works</a></div></header><section class="stats" id="statsSection"><article class="stat"><span class="stat-label">Total</span><strong class="stat-value" id="totalExpense">Rp0</strong></article><article class="stat"><span class="stat-label">Beli</span><strong class="stat-value" id="totalPurchases">0</strong></article><article class="stat"><span class="stat-label">Favorit</span><strong class="stat-value" id="favoriteBrand">-</strong></article><article class="stat"><span class="stat-label">Rata&#178;</span><strong class="stat-value" id="averageExpense">Rp0</strong></article></section><section class="add-box"><form class="add-form" id="coffeeForm"><div class="add-fields"><input type="text" id="brandInput" placeholder="Brand" required/><input type="text" id="variantInput" placeholder="Varian" required/><input type="number" id="priceInput" placeholder="Harga" min="1" required/><input type="date" id="dateInput" required/></div><div class="add-actions"><button class="primary-button" type="submit">+ Tambah</button><button class="secondary-button" id="lockButton" type="button">Kunci</button></div></form></section><section class="history-box"><div class="history-header"><h2>Histori</h2><div class="history-controls"><input type="search" id="searchInput" placeholder="Cari brand..."/><select id="sortSelect"><option value="date-desc">Terbaru</option><option value="date-asc">Terlama</option><option value="price-desc">Harga tertinggi</option><option value="price-asc">Harga terendah</option></select><button class="text-button" id="exportCsvButton" type="button">CSV</button></div></div><div class="table-wrap"><table><thead><tr><th>Brand</th><th>Varian</th><th>Harga</th><th>Tanggal</th><th></th></tr></thead><tbody id="historyBody"></tbody></table><p class="empty-state" id="historyEmpty" hidden>Belum ada data.</p></div></section><section class="charts-box" id="statsCharts" hidden><div class="chart-item"><h3>Pengeluaran bulanan</h3><div class="chart-wrap"><canvas id="monthlyChart"></canvas></div></div><div class="chart-item"><h3>Brand favorit</h3><div class="chart-wrap"><canvas id="brandChart"></canvas></div></div></section><p class="empty-state" id="statsEmpty" hidden>Belum ada data untuk grafik.</p></div></body></html>
